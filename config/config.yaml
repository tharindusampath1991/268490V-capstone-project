# Project configuration: zones, dates, seed and gate thresholds.
# Times are UTC internally. Delivery days are defined in Europe/Berlin.

seed: 42

# The day-ahead market's clock. It defines delivery days (PROJECT_CONTEXT section 5).
market:
  timezone: Europe/Berlin
  quarter_hour_start: "2025-10-01"   # first delivery day with 15-minute prices

# Folders, relative to the repo root.
paths:
  raw: data/raw
  processed: data/processed
  # Approved columns and empty values per zone and table. Written when DATA_END is frozen.
  approved_gaps: config/approved_gaps.yaml
  coverage_report: docs/coverage_gate.md
  figures: reports/figures   # written by the EDA commands, committed
  crosscheck_report: docs/price_crosscheck.md
  # Results for zones whose Energy-Charts data is for private and internal use only.
  # Under data/, which git ignores. Never commit this file.
  crosscheck_local_report: data/local/price_crosscheck_restricted.md

# ENTSO-E API client. Without a timeout a stalled request never ends.
entsoe:
  timeout_seconds: 120

# Energy-Charts API, used only for the price cross-check (DECISIONS entry 7).
energy_charts:
  price_url: https://api.energy-charts.info/v2/price
  timeout_seconds: 120
  pause_seconds: 31      # wait before each request. The API allows 2 price requests per minute.

crosscheck:
  tolerance: 0.01        # EUR/MWh. Larger differences count as mismatches.

# Open-Meteo Single Runs API: archived weather forecast runs (DECISIONS entries 25 to 27).
# For delivery day D the download asks for the run of day D-1 at run_hour_utc.
open_meteo:
  url: https://single-runs-api.open-meteo.com/v1/forecast
  model: ecmwf_ifs          # ECMWF IFS HRES, 9 km
  run_hour_utc: 0
  first_run: "2024-03-14"   # earliest archived run of this model. Quoted so YAML keeps it a string.
  forecast_hours: 48        # from the run time. Covers every hour of delivery day D.
  variables:
    - temperature_2m        # deg C
    - wind_speed_10m        # m/s
    - wind_speed_100m       # m/s
    - shortwave_radiation   # W/m2, mean of the hour before the timestamp
  wind_speed_unit: ms
  timeout_seconds: 60
  pause_seconds: 1.0        # wait before each request. The free limit is 5000 calls per hour.
  retry_attempts: 3         # attempts per request when the connection drops or times out
  retry_wait_seconds: 10    # wait between those attempts

data:
  start: "2019-01-01"   # first delivery day. Quoted so YAML keeps it a string.
  end: "2026-11-19"     # DATA_END, the last delivery day. Frozen on Tue 24 Nov 2026
                        # (DECISIONS entry 29). Never move it.

# Split by time (PROJECT_CONTEXT section 4). The test set is the last test_days delivery
# days up to data.end, the validation set the validation_days before it, train the rest.
# The two absolute dates were written when DATA_END was frozen. Never move them. A test
# checks that they follow from data.end and the two lengths.
splits:
  test_days: 90
  validation_days: 60
  validation_start: "2026-06-23"   # validation: 2026-06-23 to 2026-08-21
  test_start: "2026-08-22"         # test: 2026-08-22 to 2026-11-19

# EDA 1 (docs/DECISIONS.md, entry 38). An hour is a spike when its price is above the mean
# plus spike_sd standard deviations of the spike_window_days days before it. Both numbers
# are conventions. They were not tuned.
eda:
  spike_window_days: 28
  spike_sd: 3

# Zones are processed in this order: core first, then extra.
#   key              ENTSO-E area key used by entsoe-py
#   holiday_country  country code for the `holidays` package
#   energy_charts    Energy-Charts bidding zone (bzn) for the price cross-check. The API
#                    states the licence of each answer: CC BY 4.0 for DE-LU, FR and SE4,
#                    private and internal use only for ES, SE1, SE2 and SE3 (2026-11-20).
#   group            core  = approved in Milestone 1
#                    extra = added 19 Nov 2026 (docs/DECISIONS.md, entry 1)
#   weather_point    the one place whose weather forecast stands for the zone
#                    (docs/DECISIONS.md, entry 27). Degrees north and east.
zones:
  - key: DE_LU
    holiday_country: DE
    group: core
    energy_charts: DE-LU
    weather_point: {place: Kassel, latitude: 51.32, longitude: 9.50}
  - key: FR
    holiday_country: FR
    group: core
    energy_charts: FR
    weather_point: {place: Paris, latitude: 48.86, longitude: 2.35}
  - key: ES
    holiday_country: ES
    group: core
    energy_charts: ES
    weather_point: {place: Madrid, latitude: 40.42, longitude: -3.70}
  - key: SE_1
    holiday_country: SE
    group: extra
    energy_charts: SE1
    weather_point: {place: Luleå, latitude: 65.58, longitude: 22.15}
  - key: SE_2
    holiday_country: SE
    group: extra
    energy_charts: SE2
    weather_point: {place: Sundsvall, latitude: 62.40, longitude: 17.32}
  - key: SE_3
    holiday_country: SE
    group: extra
    energy_charts: SE3
    weather_point: {place: Stockholm, latitude: 59.33, longitude: 18.07}
  - key: SE_4
    holiday_country: SE
    group: extra
    energy_charts: SE4
    weather_point: {place: Malmö, latitude: 55.60, longitude: 13.01}

# Day-1 coverage gate (PROJECT_CONTEXT section 3.1). Shares are per year.
coverage_gate:
  price_min_share: 0.99      # market time units with a price
  forecast_min_share: 0.95   # hours with a load forecast / a wind forecast
  # Forecast columns kept although one year is below forecast_min_share.
  # Each entry needs a decision in docs/DECISIONS.md (entry 19 for ES).
  keep_columns:
    - zone: ES
      column: Wind Onshore
  # Forecast columns the gate report marks "drop". The cleaning step leaves them out of
  # the processed tables. Keep this list equal to the drop marks in docs/coverage_gate.md.
  drop_columns:
    - zone: FR
      column: Wind Offshore
    - zone: SE_1
      column: Solar
    - zone: SE_2
      column: Solar
    - zone: SE_3
      column: Solar
    - zone: SE_4
      column: Solar
