# Project configuration: zones, dates, seed and gate thresholds.
# Times are UTC internally. Delivery days are defined in Europe/Berlin.

seed: 42

# The day-ahead market's clock. It defines delivery days (PROJECT_CONTEXT section 5).
market:
  timezone: Europe/Berlin
  quarter_hour_start: "2025-10-01"   # first delivery day with 15-minute prices

# Folders, relative to the repo root.
paths:
  raw: data/raw
  processed: data/processed
  # Approved columns and empty values per zone and table. Written when DATA_END is frozen.
  approved_gaps: config/approved_gaps.yaml
  coverage_report: docs/coverage_gate.md
  figures: reports/figures   # written by the EDA commands, committed
  results: reports/results   # written by the backtest command, committed
  # Forecasts per market time unit, with the actual prices beside them. Under data/, which
  # git ignores. The naive forecast is the ENTSO-E price of 7 days before. Never commit it.
  forecasts: data/forecasts
  # Feature frames per zone and experiment, written by the features command for inspection.
  # Under data/, which git ignores. The backtest never reads them.
  features: data/features
  crosscheck_report: docs/price_crosscheck.md
  # Results for zones whose Energy-Charts data is for private and internal use only.
  # Under data/, which git ignores. Never commit this file.
  crosscheck_local_report: data/local/price_crosscheck_restricted.md

# ENTSO-E API client. Without a timeout a stalled request never ends.
entsoe:
  timeout_seconds: 120

# Energy-Charts API, used only for the price cross-check (DECISIONS entry 7).
energy_charts:
  price_url: https://api.energy-charts.info/v2/price
  timeout_seconds: 120
  pause_seconds: 31      # wait before each request. The API allows 2 price requests per minute.

crosscheck:
  tolerance: 0.01        # EUR/MWh. Larger differences count as mismatches.

# Open-Meteo Single Runs API: archived weather forecast runs (DECISIONS entries 25 to 27).
# For delivery day D the download asks for the run of day D-1 at run_hour_utc.
open_meteo:
  url: https://single-runs-api.open-meteo.com/v1/forecast
  model: ecmwf_ifs          # ECMWF IFS HRES, 9 km
  run_hour_utc: 0
  first_run: "2024-03-14"   # earliest archived run of this model. Quoted so YAML keeps it a string.
  forecast_hours: 48        # from the run time. Covers every hour of delivery day D.
  variables:
    - temperature_2m        # deg C
    - wind_speed_10m        # m/s
    - wind_speed_100m       # m/s
    - shortwave_radiation   # W/m2, mean of the hour before the timestamp
  wind_speed_unit: ms
  timeout_seconds: 60
  pause_seconds: 1.0        # wait before each request. The free limit is 5000 calls per hour.
  retry_attempts: 3         # attempts per request when the connection drops or times out
  retry_wait_seconds: 10    # wait between those attempts

data:
  start: "2019-01-01"   # first delivery day. Quoted so YAML keeps it a string.
  end: "2026-11-19"     # DATA_END, the last delivery day. Frozen on Tue 24 Nov 2026
                        # (DECISIONS entry 29). Never move it.

# Split by time (PROJECT_CONTEXT section 4). The test set is the last test_days delivery
# days up to data.end, the validation set the validation_days before it, train the rest.
# The two absolute dates were written when DATA_END was frozen. Never move them. A test
# checks that they follow from data.end and the two lengths.
splits:
  test_days: 90
  validation_days: 60
  validation_start: "2026-06-23"   # validation: 2026-06-23 to 2026-08-21
  test_start: "2026-08-22"         # test: 2026-08-22 to 2026-11-19

# Backtest (PROJECT_CONTEXT section 5). Delivery day D is forecast on D-1 before the
# 12:00 gate closure. Each column of the hourly and the 15-minute table stands under one
# cut. A column that is listed nowhere stops the run.
backtest:
  # Defaults of PROJECT_CONTEXT section 5. They were not tuned. Their tuning belongs to
  # the first model that trains.
  refit_every_days: 7             # fit is called on the first scored day and every 7th day after it
  # Days of history a model receives when its entry under models names none. null: all, from
  # the first row. The naive reference of every run receives this value.
  history_days: null
  # The statistical baseline, frozen on 2026-11-25 (docs/DECISIONS.md, entry 64). Of the 15
  # candidates under models it had the lowest mean relative MAE over the seven zones on the
  # validation days of experiment H. Never change it.
  statistical_baseline: mstl_182
  # Models that may be scored on the test days. Every other model is refused there.
  # mstl_182 was added on 2026-11-25, after it was frozen and the owner said yes.
  test_models: [naive, mstl_182]
  price_column: price             # known through the end of D-1
  day_ahead_columns:              # day-ahead forecasts, known through the end of D
    - load_forecast
    - wind_onshore_forecast
    - wind_offshore_forecast
    - solar_forecast
  delayed_columns:                # known through the end of D-2
    - actual_load
  # The weather table has its own cut (docs/DECISIONS.md, entry 78). Its columns are
  # open_meteo.variables. A value is known for D when it stands before the end of D and its
  # model run started at or before open_meteo.run_hour_utc on D-1. This column holds the run.
  weather_run_column: run

# Features of the LightGBM model (docs/DECISIONS.md, entries 69 to 80). One list for all
# seven zones. A lag is the value at the same wall-clock time in market time some days
# before. The price lags were measured on train days (docs/MODEL_NOTES.md).
features:
  # The groups that are built. price, calendar, actual_load and weather are fixed names, the
  # others are the keys of forecasts below. Leave a group out to build without it (RQ2).
  groups: [price, calendar, load_forecast, wind_forecast, solar_forecast, actual_load, weather]
  price_lag_days: [1, 2, 3, 4, 5, 6, 7]
  price_day_stats: [mean, min, max, last]   # of the prices of D-1
  # Feature name: the day-ahead columns summed into it. A zone uses the columns it has. A
  # zone that has none of them, such as a Swedish zone for solar, gets an empty feature.
  forecasts:
    load_forecast: [load_forecast]
    wind_forecast: [wind_onshore_forecast, wind_offshore_forecast]
    solar_forecast: [solar_forecast]
  forecast_lag_days: [1, 7]                 # besides the forecast at the target time
  actual_load_lag_days: [2]                 # the D-2 cut leaves a lag of 1 day empty
  # Weather columns that hold the mean of the hour before their timestamp. The delivery hour
  # that starts at t takes the value stamped t plus one hour.
  weather_hour_before: [shortwave_radiation]

# Model settings, copied into every results row. --model of the backtest takes a name from here.
models:
  naive:
    lag_days: 7   # the price of the same local market time unit 7 days before. A definition, not tuned.

  # Candidates for the statistical baseline, compared on the validation days of all seven
  # zones on experiment H. They read the price history only.
  #   family        arima (AutoARIMA), ets (AutoETS) or mstl (MSTL) of statsforecast
  #   season_days   season lengths in days. One day is 24 hourly or 96 quarter-hour steps.
  #   history_days  days of prices before the delivery day that the model is fitted on
  #   form          ets: letters for error, trend and season. A additive, N none, Z chosen
  #                 by the model among none and additive. The error is always A, because a
  #                 multiplicative form cannot take a negative price.
  #   trend_form    mstl: the ETS form that forecasts the trend. It has no season.
  #   search        arima: arguments of AutoARIMA that limit the search for the orders.
  #                 Without it the search has the defaults of statsforecast.
  ets_28:  {family: ets, form: AZA, season_days: [1], history_days: 28}
  ets_56:  {family: ets, form: AZA, season_days: [1], history_days: 56}
  ets_91:  {family: ets, form: AZA, season_days: [1], history_days: 91}
  ets_182: {family: ets, form: AZA, season_days: [1], history_days: 182}
  ets_364: {family: ets, form: AZA, season_days: [1], history_days: 364}
  # The season is left to the model here. On train days it chose no season.
  ets_auto_56: {family: ets, form: AZZ, season_days: [1], history_days: 56}
  mstl_28:  {family: mstl, trend_form: AZN, season_days: [1, 7], history_days: 28}
  mstl_56:  {family: mstl, trend_form: AZN, season_days: [1, 7], history_days: 56}
  mstl_91:  {family: mstl, trend_form: AZN, season_days: [1, 7], history_days: 91}
  mstl_182: {family: mstl, trend_form: AZN, season_days: [1, 7], history_days: 182}
  mstl_364: {family: mstl, trend_form: AZN, season_days: [1, 7], history_days: 364}
  arima_28: {family: arima, season_days: [1], history_days: 28}
  arima_small_28: {family: arima, search: {max_p: 2, max_q: 2, max_P: 1, max_Q: 1}, season_days: [1], history_days: 28}
  arima_small_56: {family: arima, search: {max_p: 2, max_q: 2, max_P: 1, max_Q: 1}, season_days: [1], history_days: 56}
  arima_small_91: {family: arima, search: {max_p: 2, max_q: 2, max_P: 1, max_Q: 1}, season_days: [1], history_days: 91}

  # Candidates for the LightGBM model, compared on the validation days of all seven zones
  # on experiment H.
  #   groups        the feature groups the model uses, from features.groups above
  #   objective     the error the trees are grown on. regression is the squared error.
  #   trees         number of boosting rounds, one tree per round
  #   params        LightGBM parameters. {} leaves the defaults of LightGBM, a learning rate
  #                 of 0.1 and 31 leaves per tree.
  #   history_days  days before the delivery day that the model receives, as a moving
  #                 window. Without it the model receives every day before the delivery day.
  # The weather table starts on 2024-03-15. 826 days are 118 weeks, so at the first fit the
  # window of the two entries on 826 days lies inside the weather period.
  lgbm_price: {family: lgbm, objective: regression, trees: 100, params: {},
               groups: [price, calendar]}
  lgbm_fcst: {family: lgbm, objective: regression, trees: 100, params: {},
              groups: [price, calendar, load_forecast, wind_forecast, solar_forecast]}
  lgbm_load: {family: lgbm, objective: regression, trees: 100, params: {},
              groups: [price, calendar, load_forecast, wind_forecast, solar_forecast, actual_load]}
  lgbm_all: {family: lgbm, objective: regression, trees: 100, params: {},
             groups: [price, calendar, load_forecast, wind_forecast, solar_forecast, actual_load, weather]}
  lgbm_load_826: {family: lgbm, objective: regression, trees: 100, params: {}, history_days: 826,
                  groups: [price, calendar, load_forecast, wind_forecast, solar_forecast, actual_load]}
  lgbm_all_826: {family: lgbm, objective: regression, trees: 100, params: {}, history_days: 826,
                 groups: [price, calendar, load_forecast, wind_forecast, solar_forecast, actual_load, weather]}
  lgbm_load_364: {family: lgbm, objective: regression, trees: 100, params: {}, history_days: 364,
                  groups: [price, calendar, load_forecast, wind_forecast, solar_forecast, actual_load]}
  lgbm_all_364: {family: lgbm, objective: regression, trees: 100, params: {}, history_days: 364,
                 groups: [price, calendar, load_forecast, wind_forecast, solar_forecast, actual_load, weather]}

# EDA 1 (docs/DECISIONS.md, entry 38). An hour is a spike when its price is above the mean
# plus spike_sd standard deviations of the spike_window_days days before it. Both numbers
# are conventions. They were not tuned.
eda:
  spike_window_days: 28
  spike_sd: 3
  # EDA 2 (docs/DECISIONS.md, entries 42 to 49). Conventions, not tuned.
  median_bins: 20            # equal-count bins of an input for the median price line
  share_bins: 10             # bins of the residual load for the share of flagged hours
  solar_day_groups: 3        # groups of delivery days by their solar forecast
  # A month is in the high-price period when the mean of the core zones' monthly mean
  # prices is above regime_factor times the median of that monthly series.
  regime_factor: 2
  holiday_window_days: 7     # a holiday is compared with the working days this many days before and after it
  regional_share_edges: [0.25, 0.5]   # groups of regional holidays by share of subdivisions
  nordic_flow_based_start: "2024-10-30"   # first delivery day of Nordic flow-based market coupling
  # Zones that EDA 2 compares each with the next one in this order: the Swedish zones from
  # north to south (docs/DECISIONS.md, entries 48 and 60).
  neighbour_zones: [SE_1, SE_2, SE_3, SE_4]

# Zones are processed in this order: core first, then extra. All seven zones are core.
#   key              ENTSO-E area key used by entsoe-py
#   holiday_country  country code for the `holidays` package
#   holiday_categories  holiday categories of that package. Nationwide days only
#                    (docs/DECISIONS.md, entry 46)
#   energy_charts    Energy-Charts bidding zone (bzn) for the price cross-check. The API
#                    states the licence of each answer: CC BY 4.0 for DE-LU, FR and SE4,
#                    private and internal use only for ES, SE1, SE2 and SE3 (2026-11-20).
#   group            core  = in every analysis, model run and results table. Never cut.
#                    extra = runs after the core zones, in its own results files. No zone
#                            has this group.
#   weather_point    the one place whose weather forecast stands for the zone
#                    (docs/DECISIONS.md, entry 27). Degrees north and east.
zones:
  - key: DE_LU
    holiday_country: DE
    holiday_categories: [public]
    group: core
    energy_charts: DE-LU
    weather_point: {place: Kassel, latitude: 51.32, longitude: 9.50}
  - key: FR
    holiday_country: FR
    holiday_categories: [public]
    group: core
    energy_charts: FR
    weather_point: {place: Paris, latitude: 48.86, longitude: 2.35}
  - key: ES
    holiday_country: ES
    holiday_categories: [public]
    group: core
    energy_charts: ES
    weather_point: {place: Madrid, latitude: 40.42, longitude: -3.70}
  - key: SE_1
    holiday_country: SE
    holiday_categories: [public, de_facto]
    group: core
    energy_charts: SE1
    weather_point: {place: Luleå, latitude: 65.58, longitude: 22.15}
  - key: SE_2
    holiday_country: SE
    holiday_categories: [public, de_facto]
    group: core
    energy_charts: SE2
    weather_point: {place: Sundsvall, latitude: 62.40, longitude: 17.32}
  - key: SE_3
    holiday_country: SE
    holiday_categories: [public, de_facto]
    group: core
    energy_charts: SE3
    weather_point: {place: Stockholm, latitude: 59.33, longitude: 18.07}
  - key: SE_4
    holiday_country: SE
    holiday_categories: [public, de_facto]
    group: core
    energy_charts: SE4
    weather_point: {place: Malmö, latitude: 55.60, longitude: 13.01}

# Day-1 coverage gate (PROJECT_CONTEXT section 3.1). Shares are per year.
coverage_gate:
  price_min_share: 0.99      # market time units with a price
  forecast_min_share: 0.95   # hours with a load forecast / a wind forecast
  # Forecast columns kept although one year is below forecast_min_share.
  # Each entry needs a decision in docs/DECISIONS.md (entry 19 for ES).
  keep_columns:
    - zone: ES
      column: Wind Onshore
  # Forecast columns the gate report marks "drop". The cleaning step leaves them out of
  # the processed tables. Keep this list equal to the drop marks in docs/coverage_gate.md.
  drop_columns:
    - zone: FR
      column: Wind Offshore
    - zone: SE_1
      column: Solar
    - zone: SE_2
      column: Solar
    - zone: SE_3
      column: Solar
    - zone: SE_4
      column: Solar
